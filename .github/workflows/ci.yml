name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"       # tier 3 nightly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: "Tier 1: static"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - run: pixi run postinstall
      - run: bash tests/test_static.sh

  endtoend:
    name: "Tier 2: end to end"
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - run: pixi run postinstall
      - run: bash tests/test_endtoend.sh
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: results/report.html
          if-no-files-found: ignore

  correctness:
    name: "Tier 3: correctness"
    # Simulates and clusters twice over, so it runs nightly and on demand
    # rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - run: pixi run postinstall
      - run: pixi run --frozen Rscript tests/test_correctness.R
