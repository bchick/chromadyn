# ---------------------------------------------------------------------------
# Demo configuration: the bundled T cell ATAC timecourse.
#
#   pixi run demo
#
# Overrides only what the demo needs; every other key comes from
# config/config.yaml. See demo/PROVENANCE.md for what this data is.
# ---------------------------------------------------------------------------
input:
  samplesheet: demo/samplesheet.tsv
  counts: demo/counts.tsv
  features: demo/features.bed     # region mode: coordinates are real, so BED export runs
  baseline_group: shared          # no row uses it; this is a single-arm timecourse
  time_unit: days

output:
  dir: results

report:
  title: "timecourse-patterns demo: CD8+ T cell ATAC timecourse (GSE228171)"

superclusters:
  split:
    # Tuned for this dataset, and a worked example of why the knob exists.
    #
    # The demo grid is 0/3/5/8 days, near-linear, where the shipped default of
    # cross: 0.0 cannot separate a sustained rise from a late one: both sit
    # near their own mean at day 3 (-0.02 and -0.91), so both satisfy
    # "below the mean at mid" and the labeller reports the ambiguity and falls
    # back to numbers. A margin of -0.5 separates them correctly.
    #
    # The default stays 0.0 because that is the value the source analysis
    # used, and the defaults are meant to reproduce it.
    cross: -0.5
