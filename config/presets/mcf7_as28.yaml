# ---------------------------------------------------------------------------
# MCF7 AS28 ATAC timecourse: the parameters of the analysis chromadyn's method
# was extracted from.
#
# Source: analyses/05_atac_temporal_clustering in the MCF7 project, notebooks
# 00_preprocessing.Rmd and 01_degpatterns_clustering.Rmd. Two ligand arms,
# EGF and HRG, sharing one unstimulated baseline; five timepoints in minutes.
#
# This file is the record of what that analysis actually used. Every value
# here appears in its params block. It is also what tests/test_fidelity_mcf7.R
# runs, when the source project is present, to check that chromadyn still
# reproduces the original trajectory classes.
#
# Set input.counts and input.samplesheet to your own copy before using it.
# ---------------------------------------------------------------------------
input:
  samplesheet: config/samplesheet.tsv
  counts: data/counts.tsv
  features: null
  baseline_group: shared        # the two t=0 libraries serve both arms
  time_unit: min

filter:
  min_mean_counts: 10           # 00_preprocessing.Rmd:346

transform:
  method: vst                   # no rlog; 00_preprocessing.Rmd:348
  blind: true

batch_correct:
  method: none

differential:
  method: lrt                   # per-arm LRT; 01_degpatterns_clustering.Rmd:126
  fdr: 0.01                     # params$lrt_padj
  min_range: 0.5                # params$lrt_lfc, which is a VST range and NOT
                                # a log2 fold change despite the name. See
                                # docs/method.md.
  design: "~ time"
  reduced: "~ 1"

cluster:
  seed: 42
  degpatterns:
    minc: 50                    # params$minc
    cutoff: 0.5                 # params$degp_cutoff, inert in DEGreport; kept
                                # so the record of the original run is complete
    reduce: false
    scale: true
    col: null                   # each arm clustered in its own run

superclusters:
  method: shape
  auto_label: shape
  shape:
    mid_fraction: 0.25          # 0.25 * 240 = 60, the value hard-coded in the
                                # source at 01_degpatterns_clustering.Rmd:944
    cross: 0.0
  split:
    target: Increasing          # three Increasing sub-shapes; 01:876-999
    k: 3
    seed: 42                    # set.seed(42) before kmeans, 01:892
    late_ratio_cutoff: 0.5
    late_peak_fraction: 0.5     # 0.5 * 240 = 120, the source's peak_time test
    mid_fraction: 0.25
    cross: 0.0

report:
  title: "chromadyn: MCF7 AS28 ATAC timecourse"
