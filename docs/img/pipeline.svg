<text class="tool" x="625" y="276" text-anchor="middle">single replicate</text>
<text class="name" x="790" y="112" text-anchor="middle">Two-gate selection</text>
<text class="tool" x="790" y="130" text-anchor="middle">FDR + min_range</text>
<text class="name" x="330" y="319" text-anchor="middle">QC</text>
<text class="tool" x="330" y="336" text-anchor="middle">PCA, correlations</text>
<text class="name" x="820" y="287" text-anchor="middle">k-means</text>
<text class="tool" x="820" y="305" text-anchor="middle">stats::kmeans</text>
<text class="name" x="820" y="434" text-anchor="middle">Cluster</text>
