<text class="tool" x="245" y="130" text-anchor="middle">IDs, times</text>
<text class="name" x="350" y="112" text-anchor="middle">Prefilter</text>
<text class="tool" x="350" y="130" text-anchor="middle">low counts</text>
<text class="name" x="455" y="112" text-anchor="middle">Transform</text>
<text class="tool" x="455" y="130" text-anchor="middle">DESeq2 VST</text>
<text class="name" x="625" y="112" text-anchor="middle">Test over time</text>
