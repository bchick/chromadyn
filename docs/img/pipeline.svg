<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="t d">
<title id="t">timecourse-patterns pipeline</title>
<desc id="d">Metro map of the workflow. Over all samples: validate, prefilter, transform, QC. Per treatment arm: a DESeq2 test over time or variance ranking, two-gate selection, clustering with degPatterns or k-means, trajectory classes, figures, and in region mode BED export and annotation. Then a cross-arm comparison, an HTML report and a run manifest.</desc>
<style>
  :root { --main:#2563eb; --km:#ea580c; --sr:#16a34a; --reg:#9333ea; --qc:#64748b;
          --ink:#1f2937; --muted:#6b7280; --fill:#ffffff; --box:#94a3b8; --card:#f8fafc; }
  @media (prefers-color-scheme: dark) {
    :root { --main:#60a5fa; --km:#fb923c; --sr:#4ade80; --reg:#c084fc; --qc:#94a3b8;
            --ink:#e6edf3; --muted:#9ca3af; --fill:#0d1117; --box:#6e7681; --card:#161b22; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .name { font-size: 15px; font-weight: 600; }
  .tool { font-size: 13px; fill: var(--muted); }
  .small { font-size: 13px; fill: var(--muted); }
  .title { font-size: 24px; font-weight: 700; }
  .sub { font-size: 14px; fill: var(--muted); }
  .line { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .main { stroke: var(--main); } .km { stroke: var(--km); } .sr { stroke: var(--sr); }
  .reg { stroke: var(--reg); } .qc { stroke: var(--qc); }
  .dash { stroke-dasharray: 2 11; }
  .stn { fill: var(--fill); stroke-width: 4; }
  .box { fill: none; stroke: var(--box); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .card { fill: var(--card); stroke: var(--box); stroke-width: 1.5; }
</style>

<text class="title" x="30" y="42">timecourse-patterns</text>
<text class="sub" x="30" y="64">A Snakemake workflow built on DESeq2 and DEGreport</text>
<rect class="box" x="530" y="82" width="440" height="503" rx="14"/>
<text class="small" x="544" y="573">per treatment arm, each against the shared baseline</text>
<rect class="card" x="30" y="88" width="150" height="36" rx="6"/>
<text class="name" x="105.0" y="111.0" text-anchor="middle">samplesheet.tsv</text>
<rect class="card" x="30" y="132" width="150" height="36" rx="6"/>
<text class="name" x="105.0" y="155.0" text-anchor="middle">counts matrix</text>
<rect class="card" x="30" y="176" width="150" height="36" rx="6" style="stroke-dasharray:5 4"/>
<text class="name" x="105.0" y="199.0" text-anchor="middle">features.bed</text>
<text class="small" x="105" y="230" text-anchor="middle">optional: region mode</text>
