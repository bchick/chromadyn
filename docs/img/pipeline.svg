<text class="small" x="240" y="438" text-anchor="middle">HTML</text>
<rect class="card" x="190" y="450" width="100" height="40" rx="6"/>
<text class="name" x="240.0" y="475.0" text-anchor="middle">manifest</text>
<text class="small" x="240" y="508" text-anchor="middle">JSON, every seed</text>
